[project]
name = "tesseract-sidecar"
version = "0.1.0"
description = "Tesseract AI Agent Python sidecar"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pandas>=2.0.0",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
voice = [
    "pvporcupine>=3.0.0",
    "whisper-cpp-python>=0.1.0",
    "piper-tts>=1.0.0",
    "sounddevice>=0.4.6",
]
google = [
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "cryptography>=42.0.0",
]
automation = [
    "playwright>=1.40.0",
    "pywinauto>=0.6.8",
    "pyautogui>=0.9.54",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]