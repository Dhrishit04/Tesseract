<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 6" width="1000" height="6" role="img"><title>Section divider</title><defs><linearGradient id="d"><stop offset="0" stop-color="#FF7B54" stop-opacity="0"/><stop offset=".5" stop-color="#FF7B54"/><stop offset="1" stop-color="#9D8CFF" stop-opacity="0"/></linearGradient></defs><style>text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#f1eef8}.mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace}.mut{fill:#a9a5bf}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.m{display:none}}.s{animation:s 5s ease-in-out infinite alternate}@keyframes s{from{transform:translateX(-340px)}to{transform:translateX(1000px)}}</style><rect y="3" width="1000" height="1" fill="#a9a5bf" fill-opacity=".3"/><rect class="s" y="1.5" width="340" height="3" rx="1.5" fill="url(#d)"/></svg>
